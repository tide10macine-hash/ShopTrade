<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0605">
<title>Makho</title>
<style>
@font-face{font-family:"Oxanium";src:url(fonts/oxanium-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Oxanium";src:url(fonts/oxanium-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
/* Makho – Kommandostand im Hochformat. Ein Raster, das je nach Zustand umgebaut wird; die Kugel folgt ihrem Platzhalter auf der Leinwand. */
:root{
  --bg:#0a0605;--panel:#150c0a;--panel2:#1d120e;--line:rgba(255,122,64,.15);--line2:rgba(255,122,64,.38);
  --fg:#f4e7df;--muted:#a88f85;--dim:#6e5850;--accent:#ff7a3d;--hot:#ff4a2f;--good:#6fd39a;--bad:#ff6457;
  --fd:"Oxanium","Segoe UI",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace;
  --H:100vh;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:400 15px/1.45 var(--fb);overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.label{font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}

#app{position:relative;z-index:1;height:var(--H);display:grid;grid-template-columns:clamp(64px,19vw,84px) minmax(0,1fr);
  grid-template-rows:auto auto auto auto minmax(0,1fr) auto;
  grid-template-areas:"head head" "orb orb" "say say" "offer offer" "stage stage" "foot foot";
  padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 10px);column-gap:12px}
#head{grid-area:head;display:flex;align-items:center;gap:8px;height:34px;transition:opacity .6s,transform .6s;min-width:0}
#head .brand{font:700 17px/1 var(--fd);letter-spacing:.34em;margin-right:4px}
#head .brand b{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap;background:rgba(10,6,5,.5)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.chip.ok i{background:var(--good);box-shadow:0 0 6px var(--good)}.chip.bad i{background:var(--bad)}
#tchip{border-color:var(--line2);color:var(--fg)}#tchip i{background:var(--accent);animation:blink 1s steps(2) infinite}
#clock{margin-left:auto;font:500 13px var(--fm);font-variant-numeric:tabular-nums}
#orbSlot{grid-area:orb;justify-self:center;width:min(66vw,calc(var(--H) * .32));aspect-ratio:1/1;margin:8px 0 2px}
#say-wrap{grid-area:say;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:72px;padding:6px 0}
#say{margin:0;font:400 18px/1.42 var(--fb);color:var(--fg);text-wrap:pretty;overflow-wrap:anywhere}
#say .w{color:rgba(244,231,223,.42);transition:color .25s}
#say .w.on{color:var(--fg)}
#say.in{animation:sayIn .5s ease-out}
#heard{margin:0;min-height:18px;font:400 12.5px/1.4 var(--fm);color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#heard .label{color:var(--accent);margin-right:4px}
.caret{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;margin-left:3px;animation:blink .9s steps(2) infinite}
#offer{grid-area:offer;min-width:0;display:flex;flex-direction:column;gap:6px;padding:0 13px;border:0 solid var(--line2);border-radius:6px;background:linear-gradient(180deg,rgba(29,18,14,.92),rgba(21,12,10,.92));margin:4px 0 8px;opacity:0;transform:translateY(-6px);max-height:0;overflow:hidden;transition:all .45s cubic-bezier(.2,.8,.2,1)}
#offer.show{opacity:1;transform:none;max-height:140px;padding-block:11px;border-width:1px;animation:offerGlow 2.4s ease-in-out infinite}
#offer .q{margin:0;font:600 15px/1.3 var(--fd);letter-spacing:.03em}
#offer .hint b{color:var(--accent);font-weight:500}
#offer .bar{height:2px;background:var(--line);border-radius:1px;overflow:hidden}
#offer.show .bar i{display:block;height:100%;background:var(--accent);animation:drain 30s linear forwards}
#stage{grid-area:stage;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 10px,#000 calc(100% - 14px),transparent 100%)}
#stage::-webkit-scrollbar{display:none}
#foot{grid-area:foot;display:flex;align-items:center;gap:10px;padding-top:8px;min-width:0}
#mic{display:flex;align-items:center;gap:8px;flex:none}
#lvl{--l:0;display:flex;align-items:center;gap:3px;height:18px}
#lvl i{width:3px;border-radius:2px;background:var(--accent);height:calc(4px + var(--l) * var(--k) * 14px);opacity:calc(.35 + var(--l) * .65);transition:height .08s}
body[data-orb="speak"] #lvl i{background:var(--fg);animation:eq .5s ease-in-out infinite alternate;animation-delay:calc(var(--k) * -.5s)}
body[data-orb="think"] #lvl i{animation:eq .3s ease-in-out infinite alternate;animation-delay:calc(var(--k) * -.3s)}
#tip{flex:1;min-width:0;font:400 12px/1.3 var(--fm);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .5s;text-align:right}

/* Ruhezustand */
#lock{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:0 24px calc(var(--sb) + 44px);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
#lock .brand{font:700 26px/1 var(--fd);letter-spacing:.55em;margin-right:-.55em;animation:lockGlow 3.2s ease-in-out infinite}
#lock .brand b{color:var(--accent)}
#lock .hint{font:600 17px/1.3 var(--fd);letter-spacing:.1em}
#lock .hint em{font-style:normal;color:var(--accent)}
#lock .chip{font-size:11px}
#grantBox{pointer-events:auto;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:320px}
#grantBox p{margin:0;color:var(--muted);font-size:13px}
.btn{background:linear-gradient(180deg,#ff8a4c,#ff5a2a);border:0;color:#1a0904;padding:12px 18px;border-radius:4px;font:700 13px var(--fd);letter-spacing:.16em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}.dot.off{background:var(--bad)}

body[data-state="sleep"] #app{grid-template-areas:"orb orb";grid-template-rows:1fr}
body[data-state="sleep"] #orbSlot{width:min(84vw,calc(var(--H) * .5));align-self:center;margin-top:calc(var(--H) * -.12)}
body[data-state="sleep"] #head,body[data-state="sleep"] #say-wrap,body[data-state="sleep"] #offer,body[data-state="sleep"] #stage,body[data-state="sleep"] #foot{display:none}
body[data-state="sleep"] #lock{opacity:1}
body[data-state="awake"] #head{animation:headIn .8s cubic-bezier(.2,.8,.2,1) both}
body[data-state="awake"] #foot{animation:fadeIn .8s .4s both}
body.staged #app{grid-template-areas:"head head" "orb say" "offer offer" "stage stage" "foot foot"}
body.staged #orbSlot{width:100%;margin:4px 0 0;align-self:start}
body.staged #say{font-size:15px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
body.alarm::after{content:"";position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 0 3px var(--hot),inset 0 0 90px rgba(255,74,47,.45);animation:alarm 1s ease-in-out infinite}

/* Startprotokoll */
#boot{position:fixed;right:16px;top:calc(var(--st) + 52px);z-index:4;display:flex;flex-direction:column;gap:4px;pointer-events:none;opacity:0;transition:opacity .4s}
#boot.show{opacity:1}
#boot .bl{display:flex;gap:10px;justify-content:space-between;min-width:170px;font:500 10.5px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 8px;border-left:2px solid var(--accent);background:rgba(21,12,10,.85);animation:bootIn .35s ease-out both}
#boot .bl b{font-weight:500}#boot .ok{color:var(--good)}#boot .bad{color:var(--bad)}

/* Ansichten */
.view{padding:6px 0 18px;transform-origin:50% 0}
.view.leave{position:absolute;inset:0 0 auto;animation:leave .35s ease-in forwards;pointer-events:none}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.vhead{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px;position:relative;padding-bottom:8px}
.vhead::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:linear-gradient(90deg,var(--accent),transparent);transform-origin:0 50%;animation:draw .9s .1s cubic-bezier(.2,.8,.2,1) both}
.vhead h2{margin:0;font:700 clamp(22px,7vw,30px)/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.vhead .label{margin-left:auto;text-align:right;flex:none;max-width:48%}
.globebox{width:100%;max-width:440px;aspect-ratio:1/1;max-height:calc(var(--H) * .36);margin:0 auto 8px}
.globe,.wicon{width:100%;height:100%;display:block}
.news,.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.news li,.nlist li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:rgba(255,122,61,.035);position:relative;overflow:hidden}
.news li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);transform-origin:50% 0;animation:drawY .6s both;animation-delay:calc(var(--i) * 70ms + .2s)}
.news li:nth-child(-n+3)::before{background:var(--hot)}
.num{font:600 13px var(--fd);color:var(--accent);padding-top:2px}
.tag{font:500 10px var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.news h3{margin:2px 0;font:600 15px/1.3 var(--fb);overflow-wrap:anywhere}
.news p,.nlist p{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.nlist p{color:var(--fg);font-size:14.5px}
.atitle{margin:0 0 10px;font:600 19px/1.3 var(--fb)}
.v-article p{margin:0 0 10px;color:#e6d6cd;font-size:15px;line-height:1.55}
.ticker{overflow:hidden;border-block:1px solid var(--line);margin-bottom:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker .track{display:flex;gap:26px;width:max-content;padding:7px 0;font:400 12px var(--fm);animation:ticker 28s linear infinite}
.ticker b{font-weight:500;color:var(--fg)}
.qgrid,.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.q,.kpi{border:1px solid var(--line);border-radius:4px;padding:10px;min-width:0;background:rgba(255,122,61,.03)}
.qn{font:600 13px var(--fb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qv{font:500 17px var(--fm);font-variant-numeric:tabular-nums;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg{font:500 11.5px var(--fm);font-variant-numeric:tabular-nums}
.spark{width:100%;height:42px;display:block;margin-top:6px;overflow:visible}
.spark .line{stroke-dasharray:1;stroke-dashoffset:1;animation:dash 1.4s .3s cubic-bezier(.4,0,.2,1) forwards}
.spark .area{opacity:0;animation:fadeIn .8s 1.2s forwards}
.spark .end{opacity:0;animation:pop .5s 1.5s forwards;transform-box:fill-box;transform-origin:center}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bv{font:700 clamp(34px,11vw,48px)/1 var(--fd);font-variant-numeric:tabular-nums}
.big .chg{font-size:14px}
.chart .spark{height:min(170px,calc(var(--H) * .22));margin:14px 0}
.chart .spark .end{display:none}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts>div{border:1px solid var(--line);border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.facts b{font:500 13px var(--fm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wnow{display:grid;grid-template-columns:clamp(96px,30vw,140px) minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.wicon{aspect-ratio:1/1;height:auto}
.wtemp{font:700 clamp(48px,15vw,68px)/1 var(--fd)}
.wdesc{font:600 16px var(--fb)}
.wmeta{font:400 12px var(--fm);color:var(--muted);margin-top:4px}
.wdays{display:flex;flex-direction:column;gap:6px}
.wday{display:grid;grid-template-columns:58px 20px minmax(0,1fr) 76px 38px;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:4px}
.wday.on{border-color:var(--line2);background:rgba(255,122,61,.06)}
.wday .wi{font-size:16px;text-align:center}
.wday .bar{height:5px;background:rgba(255,122,61,.1);border-radius:3px;position:relative;overflow:hidden}
.wday .bar i{position:absolute;top:0;bottom:0;left:calc(var(--lo) * 100%);right:calc((1 - var(--hi)) * 100%);background:linear-gradient(90deg,#ffb347,var(--hot));border-radius:3px;transform-origin:0 50%;animation:draw .9s both;animation-delay:calc(var(--i) * 70ms + .3s)}
.wday .mono{font-size:12px;text-align:right}
.wday .rain{font:400 11px var(--fm);color:#8cbcff;text-align:right}
.wimg{width:100%;max-height:calc(var(--H) * .3);overflow:hidden;border-radius:4px;margin-bottom:10px;border:1px solid var(--line)}
.wimg img{width:100%;max-height:calc(var(--H) * .3);object-fit:cover;display:block;animation:imgIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.wdesc2{margin:0 0 8px;color:var(--accent);font:500 12.5px var(--fm)}
.extract{margin:0;font-size:15px;line-height:1.55;color:#e6d6cd}
.infobig{font:700 clamp(52px,18vw,86px)/1 var(--fd);letter-spacing:.02em;margin:18px 0 10px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;animation:popBig .7s cubic-bezier(.2,1.4,.4,1) both}
.v-info.flip .infobig{animation:flip .9s cubic-bezier(.2,.8,.2,1) both}
.v-info.alarm .infobig{color:var(--hot);animation:pulse 1s ease-in-out infinite}
.infosub{margin:0;color:var(--muted);font:400 14px var(--fm);overflow-wrap:anywhere}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.tcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--line);border-radius:6px}
.ring{width:100%;max-width:180px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:rgba(255,122,61,.12)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear;filter:drop-shadow(0 0 6px rgba(255,122,61,.6))}
.tval{position:absolute;top:calc(50% - 24px);font-size:clamp(22px,7vw,30px)}
.tcard.done{opacity:.4}
.kv{font:700 clamp(24px,7.5vw,32px)/1.05 var(--fd);margin:6px 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kbar{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.kbar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--hot),var(--accent));transform-origin:0 50%;animation:draw 1.2s .5s cubic-bezier(.2,.8,.2,1) both}
.note,.muted{font-size:13px;color:var(--muted)}
.note{border:1px dashed var(--line2);border-radius:4px;padding:8px 10px;margin:0 0 10px}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.hcard{border:1px solid var(--line);border-radius:4px;padding:10px;min-width:0}
.hcard h3{margin:0 0 6px;font:600 13px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hcard p{margin:0 0 4px;font-size:12.5px;color:#e6d6cd}

@media (min-width:600px){.qgrid,.kgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:359px){#app{padding-left:12px;padding-right:12px}.wday{grid-template-columns:48px 18px minmax(0,1fr) 68px 32px;gap:6px;padding:6px 8px}#head .chip.opt{display:none}}
@media (max-height:680px){#say{font-size:16px}#orbSlot{width:min(52vw,calc(var(--H) * .26))}}

@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes leave{to{opacity:0;transform:translateY(-10px) scale(.98)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes headIn{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes sayIn{from{opacity:.2;filter:blur(3px);transform:translateY(4px)}to{opacity:1;filter:none;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drawY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.8)}to{opacity:1;transform:scale(1)}}
@keyframes popBig{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:perspective(400px) rotateX(-270deg)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.55;transform:scale(.97)}}
@keyframes blink{50%{opacity:0}}
@keyframes eq{from{height:4px}to{height:calc(6px + var(--k) * 12px)}}
@keyframes ticker{to{transform:translateX(-50%)}}
@keyframes drain{from{width:100%}to{width:0}}
@keyframes offerGlow{50%{border-color:rgba(255,122,64,.75);box-shadow:0 0 22px rgba(255,90,40,.18)}}
@keyframes bootIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes imgIn{from{opacity:0;transform:scale(1.12);filter:saturate(0) blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes alarm{50%{opacity:.35}}
@keyframes lockGlow{50%{text-shadow:0 0 18px rgba(255,122,64,.55)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body data-state="sleep">
<canvas id="fx" aria-hidden="true"></canvas>
<main id="app">
  <header id="head">
    <div class="brand">MAKH<b>O</b></div>
    <span class="chip ok opt" id="net"><i></i><span>Online</span></span>
    <span class="chip" id="tchip" hidden><i></i><span>0:00</span></span>
    <div id="clock">--:--</div>
  </header>
  <div id="orbSlot" aria-hidden="true"></div>
  <div id="say-wrap" aria-live="polite">
    <p id="say"></p>
    <p id="heard"></p>
  </div>
  <div id="offer" role="status">
    <p class="q"></p>
    <div class="hint label">Sag <b>„Ja“</b> oder <b>„Nein“</b></div>
    <div class="bar"><i></i></div>
  </div>
  <section id="stage" aria-live="polite"></section>
  <footer id="foot">
    <div id="mic"><span id="lvl" aria-hidden="true"><i style="--k:.5"></i><i style="--k:.9"></i><i style="--k:1"></i><i style="--k:.7"></i><i style="--k:.4"></i></span><span class="label" id="micText">Hört zu</span></div>
    <div id="tip"></div>
  </footer>
  <div id="lock">
    <div class="brand">MAKH<b>O</b></div>
    <div class="hint">Sag <em>„Hallo Makho“</em></div>
    <span class="chip"><span class="dot" id="lockDot"></span><span id="lockMic">Mikrofon wird gestartet …</span></span>
    <div id="grantBox" hidden>
      <p>Makho braucht das Mikrofon. Erlaube es hier oder in den Android-Einstellungen unter Apps › Makho › Berechtigungen.</p>
      <button class="btn" id="grant">Mikrofon erlauben</button>
    </div>

<script>
  /* Bildschirmhöhe exakt übernehmen (vermeidet Skalierungsfehler durch Systemleisten) */
  (function () { const set = () => document.documentElement.style.setProperty("--H", window.innerHeight + "px"); set(); addEventListener("resize", set); })();
  /* Wechselnde Beispiele in der Fußzeile */
  (function () {
    const tips = ["Sag „Was kannst du?“", "Sag „Wie wird das Wetter morgen?“", "Sag „Wie steht der DAX?“", "Sag „Wer ist Albert Einstein?“", "Sag „Timer auf 5 Minuten“", "Sag „Was gibt es Neues?“", "Sag „Stopp“ zum Unterbrechen", "Sag „Gib mir ein Briefing“"];
    let i = 0; const el = document.getElementById("tip");
    const next = () => { el.style.opacity = 0; setTimeout(() => { el.textContent = tips[i++ % tips.length]; el.style.opacity = 1; }, 500); };
    next(); setInterval(next, 7000);
  })();
</script>
