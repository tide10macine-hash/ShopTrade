<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0605">
<title>Makho</title>
<style>
@font-face{font-family:"Oxanium";src:url(fonts/oxanium-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Oxanium";src:url(fonts/oxanium-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"IBM Plex Sans";src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
/* Makho – HUD im Stil eines Kommandostands. Nur dunkel. */
:root{
  --bg:#0a0605;--panel:#140c0a;--panel2:#1c110d;--line:rgba(255,122,64,.16);--line2:rgba(255,122,64,.4);
  --fg:#f4e7df;--muted:#a88f85;--dim:#6e5850;--accent:#ff7a3d;--hot:#ff4a2f;--good:#6fd39a;--bad:#ff6457;
  --fd:"Oxanium","Segoe UI",system-ui,sans-serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,monospace;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;overflow:hidden}
body{background-image:radial-gradient(900px 600px at 50% 30%,rgba(255,80,30,.10),transparent 65%)}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.label{font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* Orb: eine Leinwand, die je nach Zustand ihren Platz wechselt */
#orb{position:fixed;z-index:1;pointer-events:none;transition:all .9s cubic-bezier(.6,.1,.2,1)}
body.locked #orb{left:50%;top:44%;width:min(88vw,62vh);height:min(88vw,62vh);transform:translate(-50%,-50%)}
body.awake #orb{left:50%;top:calc(var(--st) + 64px);width:min(70vw,34vh);height:min(70vw,34vh);transform:translateX(-50%)}
body.awake.staged #orb{left:calc(var(--sl) + 6px);top:calc(var(--st) + 50px);width:96px;height:96px;transform:none}

/* Sperrbildschirm */
#lock{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px calc(var(--sb) + 48px);gap:14px;text-align:center}
#lock .brand{font-family:var(--fd);font-weight:700;letter-spacing:.5em;font-size:26px;margin-right:-.5em}
#lock .brand span{color:var(--accent)}
#lock .hint{font-family:var(--fd);font-weight:600;letter-spacing:.12em;font-size:17px;color:var(--fg)}
#lock .hint em{font-style:normal;color:var(--accent)}
body.awake #lock{display:none}
#lock .linkbtn{background:none;border:0;color:var(--dim);font-family:var(--fm);font-size:11.5px;letter-spacing:.08em;text-decoration:underline;cursor:pointer;padding:6px}
#lock .tapzone{position:absolute;left:50%;top:44%;width:min(88vw,62vh);height:min(88vw,62vh);transform:translate(-50%,-50%);border-radius:50%;background:none;border:0;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap;background:rgba(10,6,5,.6)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.talk{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.dot.off{background:var(--bad)}
.btn{background:transparent;border:1px solid var(--line2);color:var(--fg);padding:11px 18px;border-radius:4px;cursor:pointer;font-family:var(--fd);font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.btn.primary{background:linear-gradient(180deg,#ff8a4c,#ff5a2a);border-color:transparent;color:#1a0904}
.btn:active{transform:scale(.98)}

/* HUD */
#hud{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;padding:calc(var(--st) + 10px) max(14px,var(--sr)) calc(var(--sb) + 10px) max(14px,var(--sl));opacity:0;pointer-events:none;transition:opacity .8s .3s}
body.awake #hud{opacity:1;pointer-events:auto}
header{display:flex;align-items:center;gap:10px;height:34px;flex:none}
header .brand{font-family:var(--fd);font-weight:700;letter-spacing:.36em;font-size:17px}
header .brand span{color:var(--accent)}
header .clock{margin-left:auto;font-family:var(--fm);font-size:13px}
.spacer{flex:none;height:min(70vw,34vh);margin-top:20px;transition:height .9s cubic-bezier(.6,.1,.2,1)}
body.staged .spacer{height:0;margin-top:0}
.speech{flex:none;min-height:86px;padding:14px 4px 8px;display:flex;flex-direction:column;gap:6px;transition:padding .6s}
body.staged .speech{padding-left:108px;min-height:96px;padding-top:6px}
#caption{margin:0;font-family:var(--fb);font-size:17px;line-height:1.4;color:var(--fg);text-wrap:balance}
body.staged #caption{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#heard{margin:0;font-family:var(--fm);font-size:12px;color:var(--muted)}
#heard b{color:var(--dim);font-weight:400;letter-spacing:.12em}
.ask{flex:none;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px;margin:6px 0}
.ask p{margin:0;font-family:var(--fd);font-weight:600;letter-spacing:.04em;font-size:16px}
.ask .row{display:flex;gap:10px}.ask .row .btn{flex:1}

#stage{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s}
#stage.show{opacity:1;transform:none}
.stagehead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.stagehead h2{margin:0;font-family:var(--fd);font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.stagehead .label{margin-left:auto;text-align:right}
.globebox{position:relative;width:100%;max-width:520px;aspect-ratio:1/1;max-height:42vh;margin:0 auto 10px}
#globe{width:100%;height:100%;display:block}
.news{display:flex;flex-direction:column;gap:9px;padding-bottom:12px}
.item{border:1px solid var(--line);border-left:2px solid var(--accent);background:rgba(255,122,61,.03);padding:10px 12px;border-radius:3px}
.item:first-child{border-left-color:var(--hot)}
.item .tag{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.item h3{margin:2px 0 3px;font-weight:600;font-size:15px;line-height:1.3}
.item p{margin:0;color:var(--muted);font-size:13px}
.item a{color:var(--dim);font-family:var(--fm);font-size:11px;text-decoration:none}
.mkt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding-bottom:12px}
.q{border:1px solid var(--line);border-radius:4px;padding:10px;min-width:0}
.q .n{font-weight:600;font-size:13.5px}
.q .v{font-family:var(--fm);font-size:17px;margin-top:2px}
.q .c{font-family:var(--fm);font-size:12px}
.q svg{width:100%;height:40px;display:block;margin-top:6px}
.up{color:var(--good)}.down{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.kpi .v{font-family:var(--fd);font-weight:700;font-size:28px;line-height:1.05;margin:4px 0}
.kpi .d{font-family:var(--fm);font-size:11.5px}
.note{font-size:12.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:4px;padding:8px 10px;margin-bottom:10px}

footer{flex:none;display:flex;align-items:center;gap:8px;padding-top:8px}
footer .pill{margin-right:auto}
.icon{width:42px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;color:var(--muted)}
.icon svg{width:18px;height:18px}

/* Blätter */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel2);border-top:1px solid var(--line2);border-radius:12px 12px 0 0;padding:16px max(16px,var(--sr)) calc(var(--sb) + 16px) max(16px,var(--sl));max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--fd);letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.sheet .pair{display:flex;gap:8px}
.sheet input{width:100%;min-width:0;background:#0d0706;border:1px solid var(--line2);border-radius:4px;padding:10px}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;z-index:4;background:rgba(0,0,0,.55)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 70px);z-index:6;background:var(--panel2);border:1px solid var(--line2);padding:10px 14px;border-radius:4px;font-size:13px;width:max-content;max-width:calc(100% - 32px)}
@media (min-width:760px){.mkt,.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="locked">
<canvas id="orb" aria-hidden="true"></canvas>

<section id="lock" aria-label="Makho schläft">
  <button class="tapzone" id="tapWake" aria-label="Makho aufwecken"></button>
  <div class="brand">MAKH<span>O</span></div>
  <div class="hint" id="lockHint">Sag <em>„Hallo Makho“</em></div>
  <span class="pill"><i class="dot" id="lockDot"></i><span id="lockMic">Mikrofon wird gestartet …</span></span>
  <button class="btn primary" id="grantMic" hidden>Mikrofon erlauben</button>
  <button class="linkbtn" id="lockKb" type="button">Lieber tippen</button>
</section>

<section id="hud" aria-label="Makho">
  <header>
    <div class="brand">MAKH<span>O</span></div>
    <span class="pill"><i class="dot on"></i>SYSTEME ONLINE</span>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div class="spacer"></div>
  <div class="speech">
    <p id="caption"></p>
    <p id="heard"></p>
  </div>
  <div class="ask" id="ask" hidden>
    <p id="askText"></p>
    <div class="row"><button class="btn primary" id="yes">Ja</button><button class="btn" id="no">Nein</button></div>
  </div>
  <div id="stage" hidden></div>
  <footer>
    <span class="pill"><i class="dot" id="micDot"></i><span id="micText">Bereit</span></span>
    <button class="icon" id="kbBtn" aria-label="Befehl tippen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1M9 10h1M12 10h1M15 10h1M18 10h1M7 14h10"/></svg></button>
    <button class="icon" id="setBtn" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
  </footer>
</section>

<div class="scrim" id="scrim" hidden></div>
<form class="sheet" id="kbSheet" hidden>
  <h3>Befehl an Makho</h3>
  <input id="kbInput" autocomplete="off" placeholder="z. B. Zeig mir die Börse" aria-label="Befehl">
  <div class="row"><button class="btn primary" type="submit">Senden</button><button class="btn" type="button" data-close>Schließen</button></div>
</form>
<form class="sheet" id="setSheet" hidden>
  <h3>Zahlen der Woche</h3>
  <div id="kpiFields"></div>
  <div class="row"><button class="btn primary" type="submit">Speichern</button><button class="btn" type="button" id="resetKpi">Beispielwerte</button></div>
  <h3 style="margin-top:8px">Makho</h3>
  <div class="row"><button class="btn" type="button" id="sleepBtn">Schlafen legen</button><button class="btn" type="button" data-close>Schließen</button></div>
  <p class="label" style="text-transform:none;letter-spacing:.04em">Nachrichten: tagesschau.de · Kurse: Yahoo Finance · Ohne Internet zeigt Makho sein letztes Lagebild.</p>
</form>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= Native Bausteine ================= */
const Cap = window.Capacitor;
const native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const plug = n => native ? (Cap.registerPlugin ? Cap.registerPlugin(n) : Cap.Plugins[n]) : null;
const SR = plug("SpeechRecognition");
const TTS = plug("TextToSpeech");

/* ================= Stimme ================= */
let VOICE = {lines:{}, env:{}};
const voiceReady = fetch("voice.json").then(r => r.json()).then(v => VOICE = v).catch(() => {});
let speaking = false, level = 0, levelTarget = 0, envTimer = null, curAudio = null;
function hush(){ try{ curAudio && curAudio.pause(); }catch(e){} curAudio = null; try{ TTS ? TTS.stop() : speechSynthesis.cancel(); }catch(e){} clearInterval(envTimer); levelTarget = 0; }

function caption(text){ $("#caption").textContent = text; }
function playClip(key){
  return new Promise(res => {
    const a = new Audio("voice/" + key + ".mp3"); curAudio = a;
    const env = VOICE.env[key] || [];
    a.onplay = () => { clearInterval(envTimer); envTimer = setInterval(() => { levelTarget = env[Math.floor(a.currentTime * 30)] || 0; }, 33); };
    const done = () => { clearInterval(envTimer); levelTarget = 0; res(); };
    a.onended = done; a.onerror = done; a.onpause = done;
    a.play().catch(done);
  });
}
async function speakTTS(text){
  levelTarget = .45; const pulse = setInterval(() => levelTarget = .25 + Math.random() * .5, 110);
  try{
    const cap = wait(text.length * 95 + 4000);
    if (TTS) await Promise.race([TTS.speak({ text, lang: "de-DE", rate: 1.0, pitch: 0.9, volume: 1.0, category: "playback" }), cap]);
    else if ("speechSynthesis" in window) await Promise.race([new Promise(r => { const u = new SpeechSynthesisUtterance(text); u.lang = "de-DE"; u.pitch = .9; u.onend = u.onerror = r; speechSynthesis.speak(u); }), cap]);
    else await wait(Math.min(9000, text.length * 55));
  }catch(e){ await wait(400); }
  clearInterval(pulse); levelTarget = 0;
}
/* Eine Rede ist eine Folge aus Aufnahmen ({clip}) und Handy-Stimme ({tts}). */
let speechId = 0;
async function speak(parts){
  const id = ++speechId; hush(); speaking = true; setMic("talk");
  await voiceReady;
  for (const p of parts){
    if (id !== speechId) break;
    if (p.clip){ caption(p.show || VOICE.lines[p.clip] || ""); await playClip(p.clip); }
    else if (p.tts){ caption(p.show || p.tts); await speakTTS(p.tts); }
    await wait(180);
  }
  if (id === speechId){ speaking = false; setMic(); }
}

/* ================= Spracherkennung ================= */
let micOK = false, listening = false;
function setMic(state){
  const d = $("#micDot"), t = $("#micText");
  if (state === "talk" || speaking){ d.className = "dot talk"; t.textContent = "Makho spricht"; return; }
  if (!micOK){ d.className = "dot off"; t.textContent = "Mikrofon aus · tippe"; return; }
  d.className = "dot on"; t.textContent = "Hört zu";
}
async function micPermission(ask){
  if (!SR) return false;
  try{
    let p = await SR.checkPermissions();
    if (p.speechRecognition !== "granted" && ask) p = await SR.requestPermissions();
    return p.speechRecognition === "granted";
  }catch(e){ return false; }
}
async function listenLoop(){
  if (listening) return; listening = true;
  while (micOK){
    if (speaking || sheetOpen){ await wait(250); continue; }
    try{
      const r = await Promise.race([
        SR.start({ language: "de-DE", maxResults: 4, partialResults: false, popup: false }),
        wait(14000).then(() => { try{ SR.stop(); }catch(e){} return null; })
      ]);
      if (r && r.matches && r.matches.length) await heard(r.matches);
    }catch(e){ await wait(350); }
  }
  listening = false;
}
/* Browser-Testmodus (am PC): Web Speech, falls vorhanden */
const WebSR = !native && (window.SpeechRecognition || window.webkitSpeechRecognition);
function webListen(){
  if (!WebSR) return;
  const rec = new WebSR(); rec.lang = "de-DE"; rec.continuous = true; rec.maxAlternatives = 3;
  rec.onresult = e => { const r = e.results[e.results.length - 1]; heard([...r].map(x => x.transcript)); };
  rec.onend = () => setTimeout(() => { try{ rec.start(); }catch(e){} }, 300);
  try{ rec.start(); micOK = true; }catch(e){}
}

/* ================= Ablauf ================= */
const WAKE = /(hallo|hey|hi|hello|servus|moin)\W*(ma(k|c|ck|ch|g)?h?o|makko|macho|maho|marko|marco|mako)\b/i;
const YES = /^(ja|jo|jap|jawohl|gerne?|klar|okay|ok|bitte|na klar|sicher|natürlich|unbedingt|zeig|mach|los|sehr gern|warum nicht|auf jeden)/i;
const NO = /^(nein|nee|nö|ne\b|nicht|später|lass|kein|danke nein|nein danke)/i;
const SLEEP = /(schlaf|gute nacht|tschüss|tschau|ciao|bis später|ruhe|pause|aus machen|ausschalten)/i;
const THANKS = /^(danke|okay danke|ok danke|super|perfekt|top)\b/i;
const TOPICS = [
  ["numbers", /(zahlen|kpi|umsatz|newsletter|reichweite|statistik)/i],
  ["markets", /(börse|boerse|aktie|markt|dax|kurs|bitcoin|gold|öl\b|nasdaq|dow)/i],
  ["germany", /(deutschland|berlin|bundes|inland)/i],
  ["russia", /(russland|russen|moskau|putin|ukraine|kiew|kreml)/i],
  ["world", /(nachricht|news|welt|neuigkeit|lage|was gibt.s neues|was ist los|schlagzeile|ausland)/i]
];
const NEXT = { world:"germany", germany:"russia", russia:"markets", markets:"numbers", numbers:null };
const ASK = { world:"ask_news", germany:"ask_germany", russia:"ask_russia", markets:"ask_markets", numbers:"ask_numbers" };
let awake = false, pending = null, idleTimer = null;

async function heard(alts){
  const text = alts[0].trim(); if (!text) return;
  const any = re => alts.some(a => re.test(a.trim()));
  bumpIdle();
  if (!awake){ if (any(WAKE)) wake(); return; }
  $("#heard").innerHTML = "<b>DU ·</b> " + esc(text);
  const t = text.replace(/^(makho|macho|mako)\W*/i, "");
  if (any(SLEEP)) return sleep();
  const topic = (TOPICS.find(([, re]) => re.test(t)) || [])[0];
  if (topic) return show(topic);
  if (pending && YES.test(t)) return show(pending);
  if (pending && NO.test(t)) return decline();
  if (THANKS.test(t)){ await speak([{clip:"thanks"}]); return; }
  if (any(WAKE)){ return offer(pending || "world", true); }
  await speak([{clip:"unknown"}]);
}
function askCard(key){
  pending = key;
  if (!key){ $("#ask").hidden = true; return; }
  $("#askText").textContent = VOICE.lines[ASK[key]] || "";
  $("#ask").hidden = false;
}
async function offer(key, withMore){
  if (!key){ askCard(null); await speak([{clip:"ask_more"}]); return; }
  askCard(key); await speak([{clip: ASK[key]}]);
}
async function decline(){
  const skipped = pending; askCard(null); flow++;
  await speak([{clip:"no"}]);
  const nxt = NEXT[skipped];
  if (nxt) await offer(nxt); else await speak([{clip:"ask_more"}]);
}
async function wake(){
  if (awake) return; awake = true;
  document.body.classList.remove("locked"); document.body.classList.add("awake");
  $("#heard").textContent = ""; prefetch();
  await wait(600);
  askCard("world");
  await speak([{clip:"boot"}]);
}
async function sleep(){
  askCard(null); flow++;
  await speak([{clip:"sleep"}]);
  awake = false; hideStage();
  document.body.classList.remove("awake", "staged"); document.body.classList.add("locked");
}
function bumpIdle(){ clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (awake && !speaking){ awake = false; askCard(null); hideStage(); document.body.classList.remove("awake","staged"); document.body.classList.add("locked"); } }, 6 * 60 * 1000); }

/* ================= Bühne ================= */
function hideStage(){ const s = $("#stage"); s.classList.remove("show"); s.hidden = true; s.innerHTML = ""; document.body.classList.remove("staged"); globeOn = false; }
function openStage(html){
  const s = $("#stage"); s.hidden = false; s.innerHTML = html; s.scrollTop = 0;
  document.body.classList.add("staged");
  requestAnimationFrame(() => s.classList.add("show"));
}
let flow = 0;
async function show(topic){
  askCard(null); bumpIdle(); flow++;

async function getJSON(url, ms = 9000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try{ const r = await fetch(url, { signal: c.signal, headers: { "Accept": "application/json" } }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
const mapTS = arr => (arr || []).filter(n => n && n.title && n.type !== "video").slice(0, 8).map(n => ({
  t: n.title, top: n.topline || "", d: n.firstSentence || "", u: n.shareURL || n.detailsweb || "",
  s: "tagesschau.de" + (n.date ? " · " + new Date(n.date).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"}) + " Uhr" : "")
}));
let prefetching = null;
function prefetch(){
  if (prefetching) return prefetching;
  const base = "https://www.tagesschau.de/api2u/";
  prefetching = Promise.allSettled([
    getJSON(base + "news/?ressort=ausland").then(j => live.world = mapTS(j.news)),
    getJSON(base + "news/?ressort=inland").then(j => live.germany = mapTS(j.news)),

    loadMarkets()

  return prefetching;
}
function tagOf(n){ const s = n.top + " " + n.t + " " + n.d; let best = null, bi = 1e9; for (const p of PLACES){ const m = s.search(p[1]); if (m >= 0 && m < bi){ bi = m; best = p; } } return best; }

const SYMS = [["^GDAXI","DAX",""],["^GSPC","S&P 500",""],["^IXIC","Nasdaq",""],["^DJI","Dow Jones",""],["BZ=F","Brent","$"],["GC=F","Gold","$"],["BTC-USD","Bitcoin","$"],["EURUSD=X","Euro/Dollar",""]];
const MSNAP = [["DAX",25820,-1.92],["S&P 500",7376.86,.31],["Nasdaq",24579,1.09],["Dow Jones",51286,-.46],["Brent",97.1,null],["Gold",4060,-.67],["Bitcoin",75900,null]];
async function loadMarkets(){
  const res = await Promise.allSettled(SYMS.map(([s]) => getJSON("https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(s) + "?range=1mo&interval=1d")));
  const out = [];
  res.forEach((r, i) => {
    if (r.status !== "fulfilled") return;
    try{
      const x = r.value.chart.result[0]; const closes = x.indicators.quote[0].close.filter(v => v != null);
      const price = x.meta.regularMarketPrice ?? closes[closes.length - 1];
      const prev = closes.length > 1 ? (Math.abs(closes[closes.length - 1] - price) < 1e-9 ? closes[closes.length - 2] : closes[closes.length - 1]) : null;
      out.push({ n: SYMS[i][1], cur: SYMS[i][2], v: price, c: prev ? (price / prev - 1) * 100 : null, series: closes.concat(price) });
    }catch(e){}
  });
  if (out.length >= 3) live.markets = out;
}
const nf = (v, d) => v.toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
function spark(series, up){
  if (!series || series.length < 2) return "";
  const mn = Math.min(...series), mx = Math.max(...series), W = 200, H = 40, k = (H - 6) / ((mx - mn) || 1);
  const pts = series.map((v, i) => [i / (series.length - 1) * W, H - 3 - (v - mn) * k]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const col = up ? "#6fd39a" : "#ff6457"; const last = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d} L${W} ${H} L0 ${H}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${col}"/></svg>`;
}
async function showMarkets(){

  const fmtV = q => q.n === "Euro/Dollar" ? nf(q.v, 4) : nf(q.v, q.v > 1000 ? 0 : 2) + (q.cur ? " $" : "");
  openStage(`<div class="stagehead"><h2>Börse</h2><span class="label">${isLive ? "Live · Yahoo Finance · " + new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) : "Schluss 06.11.2026 · offline"}</span></div>
    <div class="mkt">${list.map(q => { const up = (q.c ?? 0) >= 0; return `<div class="q"><div class="n">${esc(q.n)}</div><div class="v">${fmtV(q)}</div><div class="c ${q.c == null ? "" : up ? "up" : "down"}">${q.c == null ? "–" : (up ? "▲ +" : "▼ −") + nf(Math.abs(q.c), 2) + " %"}</div>${spark(q.series, up)}</div>`; }).join("")}</div>
    ${isLive ? "" : `<div class="note">Kein Live-Zugang. Das sind die Schlusskurse vom 6. November 2026.</div>`}`);
  await introP; if (my !== flow) return;
  const pick = ["DAX","S&P 500","Nasdaq","Brent","Bitcoin"].map(n => list.find(q => q.n === n)).filter(Boolean);
  const ups = list.filter(q => (q.c ?? 0) > 0).length, downs = list.filter(q => (q.c ?? 0) < 0).length;
  const mood = ups > downs ? "Die Börsen sind heute gut gelaunt." : downs > ups ? "Die Börsen haben heute schlechte Laune." : "Die Börsen wissen heute nicht, was sie wollen.";
  const say = q => `${q.n === "S&P 500" ? "S und P 500" : q.n} ${nf(q.v, q.v > 1000 ? 0 : 2)}${q.cur ? " Dollar" : ""}${q.c == null ? "" : ", " + (q.c >= 0 ? "plus " : "minus ") + nf(Math.abs(q.c), 1) + " Prozent"}`;
  await speak([{ tts: mood + " " + pick.map(say).join(". ") + ".", show: mood }]);
  if (my === flow) await offer(NEXT.markets);

/* ================= Globus ================= */
let LAND = []; fetch("land.json").then(r => r.json()).then(a => LAND = a).catch(() => {});
let globeOn = false, gFocus = null, gMarks = [], rot = { lon: 0, lat: 20 };
function startGlobe(focus, marks){ gFocus = focus; gMarks = marks; globeOn = true; rot.lon = focus[2] - 120; }
function fit(c){ const r = c.getBoundingClientRect(), d = Math.min(2.5, devicePixelRatio || 1), w = Math.round(r.width * d), h = Math.round(r.height * d); if (w && h && (c.width !== w || c.height !== h)){ c.width = w; c.height = h; } return d; }
function proj(lat, lon, R, cx, cy){
  const rl = (lon - rot.lon) * Math.PI / 180, la = lat * Math.PI / 180, p0 = rot.lat * Math.PI / 180;
  return [cx + Math.cos(la) * Math.sin(rl) * R, cy - (Math.cos(p0) * Math.sin(la) - Math.sin(p0) * Math.cos(la) * Math.cos(rl)) * R, Math.sin(p0) * Math.sin(la) + Math.cos(p0) * Math.cos(la) * Math.cos(rl)];
}
function drawGlobe(t){
  const c = document.getElementById("globe"); if (!globeOn || !c) return;
  const g = c.getContext("2d"), d = fit(c), W = c.width, H = c.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * .44;
  g.clearRect(0, 0, W, H);
  const dl = ((gFocus[2] - rot.lon + 540) % 360) - 180; rot.lon += dl * .035; rot.lat += (gFocus[1] * .7 - rot.lat) * .035;
  const gr = g.createRadialGradient(cx - R * .3, cy - R * .3, R * .1, cx, cy, R * 1.15); gr.addColorStop(0, "rgba(255,110,50,.16)"); gr.addColorStop(1, "rgba(10,6,5,0)");
  g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, R * 1.15, 0, 7); g.fill();
  g.strokeStyle = "rgba(255,122,64,.35)"; g.lineWidth = d; g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
  const ds = Math.max(1, R / 240);
  for (let i = 0; i < LAND.length; i += 2){ const [x, y, z] = proj(LAND[i], LAND[i + 1], R, cx, cy); if (z <= 0) continue; g.fillStyle = `rgba(255,${120 + z * 50 | 0},${60 + z * 30 | 0},${.15 + z * .7})`; g.fillRect(x - ds, y - ds, ds * 2, ds * 2); }
  const [fx, fy, fz] = proj(gFocus[1], gFocus[2], R, cx, cy);
  const seen = new Set();
  for (const m of gMarks){
    if (seen.has(m[0])) continue; seen.add(m[0]);
    const [x, y, z] = proj(m[2], m[3], R, cx, cy); if (z <= .05) continue;
    if (fz > 0 && m[0] !== gFocus[0]){ g.strokeStyle = "rgba(255,122,61,.4)"; g.lineWidth = d; g.beginPath(); g.moveTo(fx, fy); g.quadraticCurveTo((fx + x) / 2, (fy + y) / 2 - Math.hypot(fx - x, fy - y) * .35, x, y); g.stroke(); }
    g.fillStyle = "#ff7a3d"; g.beginPath(); g.arc(x, y, 2.6 * d, 0, 7); g.fill();
    g.fillStyle = "rgba(244,231,223,.8)"; g.font = `${10 * d}px "IBM Plex Mono",monospace`; g.fillText(m[0].toUpperCase(), x + 6 * d, y - 5 * d);
  }
  if (fz > 0){ const p = reduce ? .5 : (Math.sin(t / 380) + 1) / 2; g.strokeStyle = `rgba(255,74,47,${.8 - p * .6})`; g.lineWidth = 1.6 * d; g.beginPath(); g.arc(fx, fy, 9 * d + p * 10 * d, 0, 7); g.stroke();
    g.fillStyle = "#ffd2b8"; g.beginPath(); g.arc(fx, fy, 4 * d, 0, 7); g.fill();
    if (gFocus[0] !== "Welt"){ g.fillStyle = "#f4e7df"; g.font = `600 ${12 * d}px "Oxanium",sans-serif`; g.fillText(gFocus[0].toUpperCase(), fx + 12 * d, fy + 4 * d); } }
}

/* ================= Orb ================= */
const oc = $("#orb"), o = oc.getContext("2d"), PTS = [];
for (let i = 0, N = 1000; i < N; i++){ const y = 1 - i / (N - 1) * 2, r = Math.sqrt(1 - y * y), th = i * 2.39996; PTS.push([Math.cos(th) * r, y, Math.sin(th) * r, Math.random() * 6.28]); }
function drawOrb(t){
  const d = fit(oc), W = oc.width, H = oc.height; if (!W) return; const cx = W / 2, cy = H / 2, R = Math.min(W, H) * .33;
  o.clearRect(0, 0, W, H); level += (levelTarget - level) * .3;
  const dim = awake ? 1 : .55, a = reduce ? 0 : t / 4200, ca = Math.cos(a), sa = Math.sin(a), ct = Math.cos(.35), st = Math.sin(.35), amp = level * .38;
  const glow = o.createRadialGradient(cx, cy, 0, cx, cy, R * 1.8); glow.addColorStop(0, `rgba(255,96,40,${(.16 + level * .45) * dim})`); glow.addColorStop(1, "rgba(255,60,20,0)");
  o.fillStyle = glow; o.beginPath(); o.arc(cx, cy, R * 1.8, 0, 7); o.fill();
  o.globalCompositeOperation = "lighter";
  for (const p of PTS){
    const x = p[0] * ca - p[2] * sa; let z = p[0] * sa + p[2] * ca; const y = p[1], y2 = y * ct - z * st; z = y * st + z * ct;
    const n = 1 + amp * Math.sin(p[3] * 3 + t / 170) + (reduce ? 0 : .03 * Math.sin(p[3] + t / 650)), rr = R * n, s = (z + 1.4) * .85 * d;
    o.fillStyle = `rgba(255,${110 + (z + 1) * 55 | 0},${50 + (z + 1) * 25 | 0},${(.12 + (z + 1) * .33) * dim})`; o.fillRect(cx + x * rr, cy + y2 * rr, s, s);
  }
  o.globalCompositeOperation = "source-over";
}
function frame(t){ drawOrb(t); drawGlobe(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
